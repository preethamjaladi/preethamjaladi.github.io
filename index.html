<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <script>
      try {
        const savedTheme = localStorage.getItem('portfolio-theme')
        const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          theme === 'light' ? '#F8F5EF' : '#020617',
        )
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <meta
      name="description"
      content="Preetham Jaladi is a Full Stack Software Engineer focused on reliable software systems, backend engineering, and AI-driven workflow development."
    />
    <meta property="og:title" content="Preetham Jaladi | Full Stack Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio for Preetham Jaladi, featuring software engineering work, AI/ML projects, and professional experience."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://portfolio.example.com/" />
    <title>Preetham Jaladi | Full Stack Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
